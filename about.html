<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Rohit Pyla | FullStack Developer</title>
    <meta name="description"
        content="I design products that feel simple, even when they're not. About Rohit Pyla - FullStack Developer & Builder.">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- MATTER.JS FOR INTERACTIVE PHYSICS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        :root {
            --bg: #ffffff;
            --ink: #0d0d0d;
            --dim: #666666;
            --serif-font: 'Instrument Serif', Georgia, serif;
            --sans-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--sans-font);
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* TOP RIGHT CONTROLS */
        .top-controls {
            position: fixed;
            top: 28px;
            right: 36px;
            z-index: 100;
            display: flex;
            gap: 12px;
        }

        .btn-phys-ctrl {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .btn-phys-ctrl:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            border-color: #cbd5e1;
        }

        /* CENTER MAIN HERO CONTENT */
        .hero-center-stage {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 920px;
            pointer-events: none;
        }

        .hello-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 6px 18px;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 28px;
            pointer-events: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .mini-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }

        .main-heading {
            font-size: clamp(2.6rem, 6.2vw, 5.2rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.035em;
            color: #0f172a;
            margin-bottom: 24px;
            pointer-events: auto;
        }

        .serif-italic-feel {
            font-family: var(--serif-font);
            font-style: italic;
            font-weight: 400;
            color: #0f172a;
        }

        .sub-description {
            font-size: clamp(1rem, 1.8vw, 1.25rem);
            color: #64748b;
            max-width: 680px;
            margin: 0 auto 32px;
            line-height: 1.6;
            pointer-events: auto;
        }

        .sub-description strong {
            color: #1e293b;
            font-weight: 700;
        }

        .drag-hint {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #94a3b8;
            pointer-events: auto;
        }

        /* BOTTOM FLOATING NAV PILL */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .floating-nav-pill {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 6px;
            border-radius: 9999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
        }

        .nav-item {
            padding: 10px 24px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: #0f172a;
        }

        .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* MATTER CANVAS CONTAINER */
        #matter-canvas-holder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #matter-canvas-holder canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>

    <!-- TOP RIGHT CONTROLS -->
    <div class="top-controls">
        <button id="btn-bounce" class="btn-phys-ctrl">⚡ Bounce</button>
        <button id="btn-drop-again" class="btn-phys-ctrl">🔄 Drop Again</button>
    </div>

    <!-- CENTER HERO ABOUT STAGE -->
    <main class="hero-center-stage">
        <div class="hello-pill">
            <img src="Airbrush-image-extender-Photoroom.png" alt="Rohit Pyla" class="mini-avatar">
            <span>Hello 👋 I'm Rohit</span>
        </div>

        <h1 class="main-heading">
            I design products that <span class="serif-italic-feel">feel</span><br>
            simple, even when they're not.
        </h1>

        <p class="sub-description">
            Currently architecting <strong>full-stack web applications</strong> and an<br>
            autonomous <strong>design &amp; engineering system</strong>.
        </p>

        <span class="drag-hint">• DRAG &amp; TOSS PILLS TO CLASH •</span>
    </main>

    <!-- BOTTOM FLOATING NAVIGATION BAR -->
    <nav class="bottom-nav-wrapper">
        <div class="floating-nav-pill">
            <a href="portfolio.html#top" class="nav-item">HOME</a>
            <a href="portfolio.html#projects" class="nav-item">WORKS</a>
            <a href="about.html" class="nav-item active">ABOUT</a>
            <a href="portfolio.html#skills" class="nav-item">SKILLS</a>
            <a href="portfolio.html#contact" class="nav-item">CONTACT</a>
        </div>
    </nav>

    <!-- MATTER CANVAS STAGE -->
    <div id="matter-canvas-holder"></div>

    <!-- MATTER.JS PHYSICS INITIALIZATION -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const holder = document.getElementById('matter-canvas-holder');
            if (!holder || typeof Matter === 'undefined') return;

            const Engine = Matter.Engine,
                Render = Matter.Render,
                Runner = Matter.Runner,
                Bodies = Matter.Bodies,
                Composite = Matter.Composite,
                Mouse = Matter.Mouse,
                MouseConstraint = Matter.MouseConstraint,
                Body = Matter.Body;

            const engine = Engine.create();
            engine.world.gravity.y = 0.95;

            const width = window.innerWidth;
            const height = window.innerHeight;

            const render = Render.create({
                element: holder,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            Render.run(render);
            const runner = Runner.create();
            Runner.run(runner, engine);

            // BOUNDARIES
            const wallOptions = { isStatic: true, render: { fillStyle: 'transparent' } };
            const ground = Bodies.rectangle(width / 2, height + 30, width * 2, 60, wallOptions);
            const leftWall = Bodies.rectangle(-30, height / 2, 60, height * 2, wallOptions);
            const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height * 2, wallOptions);
            Composite.add(engine.world, [ground, leftWall, rightWall]);

            // PILLS DATA
            const stack = [
                { label: "Spring Boot & Java ⚙️", bg: "#f97316", text: "#ffffff" },
                { label: "MongoDB & Supabase", bg: "#facc15", text: "#713f12" },
                { label: "REST APIs ⚡", bg: "#eab308", text: "#713f12" },
                { label: "React.js ⚛️", bg: "#38bdf8", text: "#0c4a6e" },
                { label: "Next.js", bg: "#1e293b", text: "#ffffff" },
                { label: "Flutter 📱", bg: "#0284c7", text: "#ffffff" },
                { label: "Kotlin", bg: "#a855f7", text: "#ffffff" },
                { label: "TypeScript", bg: "#2563eb", text: "#ffffff" },
                { label: "JavaScript 🟨", bg: "#eab308", text: "#000000" },
                { label: "Tailwind CSS", bg: "#06b6d4", text: "#ffffff" },
                { label: "Node.js 🟢", bg: "#22c55e", text: "#ffffff" },
                { label: "Git & GitHub", bg: "#ef4444", text: "#ffffff" },
                { label: "Python 🐍", bg: "#3b82f6", text: "#ffffff" },
                { label: "PostgreSQL", bg: "#1d4ed8", text: "#ffffff" },
                { label: "Firebase", bg: "#f59e0b", text: "#ffffff" }
            ];

            let pillBodies = [];

            function spawnPills() {
                pillBodies.forEach(b => Composite.remove(engine.world, b));
                pillBodies = [];

                stack.forEach((item, index) => {
                    const x = (width / 2) + (Math.random() - 0.5) * (width * 0.8);
                    const y = -60 - index * 40;
                    const pillWidth = Math.max(140, item.label.length * 11 + 36);
                    const pillHeight = 44;

                    const body = Bodies.rectangle(x, y, pillWidth, pillHeight, {
                        chamfer: { radius: 22 },
                        restitution: 0.65,
                        friction: 0.15,
                        render: {
                            fillStyle: item.bg,
                            strokeStyle: 'transparent',
                            lineWidth: 0
                        }
                    });

                    body.customData = { label: item.label, textColor: item.text };
                    pillBodies.push(body);
                });

                Composite.add(engine.world, pillBodies);
            }

            spawnPills();

            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: { visible: false }
                }
            });

            Composite.add(engine.world, mouseConstraint);
            render.mouse = mouse;

            Matter.Events.on(render, 'afterRender', () => {
                const ctx = render.context;
                ctx.font = "bold 14px 'Plus Jakarta Sans', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                pillBodies.forEach(b => {
                    ctx.save();
                    ctx.translate(b.position.x, b.position.y);
                    ctx.rotate(b.angle);
                    ctx.fillStyle = b.customData.textColor;
                    ctx.fillText(b.customData.label, 0, 1);
                    ctx.restore();
                });
            });

            const btnBounce = document.getElementById('btn-bounce');
            const btnDropAgain = document.getElementById('btn-drop-again');

            if (btnBounce) {
                btnBounce.addEventListener('click', () => {
                    pillBodies.forEach(b => {
                        Body.applyForce(b, b.position, {
                            x: (Math.random() - 0.5) * 0.1,
                            y: -0.18 - Math.random() * 0.12
                        });
                    });
                });
            }

            if (btnDropAgain) {
                btnDropAgain.addEventListener('click', spawnPills);
            }

            window.addEventListener('resize', () => {
                render.canvas.width = window.innerWidth;
                render.canvas.height = window.innerHeight;
                Body.setPosition(ground, { x: window.innerWidth / 2, y: window.innerHeight + 30 });
                Body.setPosition(rightWall, { x: window.innerWidth + 30, y: window.innerHeight / 2 });
            });
        });
    </script>
</body>

</html>
